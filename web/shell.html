<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimTower on WebAssembly</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0e0e10; color: #ddd; overflow: auto;
    font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  #stage { display: grid; place-items: start center; padding: 16px; }
  /* Presented at exactly one CSS pixel per drawn pixel.  The canvas element is
     sized from C++ to match the backbuffer, because pointer coordinates are
     derived from the element rect - any other ratio misplaces every click and
     resamples the picture. */
  canvas { display: block; background: #000; image-rendering: pixelated; }
  #gate {
    padding: 10px 16px; background: #17171a; border-bottom: 1px solid #2c2c32;
  }
  #gate code { color: #cfcfd6; }
  #gate input { margin-left: 10px; }
  #status { padding: 8px 16px; font: 12px ui-monospace, monospace; color: #8a8a92; }
  #saves {
    padding: 8px 16px; border-bottom: 1px solid #2c2c32; background: #131316;
    font: 12px ui-monospace, monospace; color: #9a9aa2;
  }
  #saves button, #saves label {
    font: 12px ui-monospace, monospace; color: #cfcfd6; background: #24242a;
    border: 1px solid #3a3a42; border-radius: 3px; padding: 2px 8px;
    margin-right: 6px; cursor: pointer;
  }
  #saves button:hover, #saves label:hover { background: #2e2e36; }
  #saves input[type=file] { display: none; }
  #saveList { display: inline; }
  #log {
    padding: 4px 16px 12px; font: 12px ui-monospace, monospace; color: #7a7a82;
    white-space: pre-wrap;
  }
  #log .bad { color: #ff8f7a; }
  #hud {
    position: fixed; right: 8px; bottom: 6px; font: 11px ui-monospace, monospace;
    color: #6a6a72; pointer-events: none;
  }
</style>
</head>
<body>
  <div id="gate">
    <strong>SimTower on WebAssembly</strong> &mdash; choose your own
    <code>SIMTOWER.EXE</code> (the 16-bit Windows 3.1 release) and the game
    starts.  Nothing is uploaded: the file is read in this browser and never
    leaves it.
    <input id="file" type="file" accept=".exe,.EXE">
  </div>
  <div id="saves">
    saved towers: <span id="saveList">&mdash;</span>
    <span style="float:right">
      <button id="refresh" type="button">refresh</button>
      <label for="import">import .TDT</label>
      <input id="import" type="file" accept=".tdt,.TDT">
    </span>
  </div>
  <div id="status">starting...</div>
  <div id="stage"><canvas id="canvas" width="800" height="600"
          oncontextmenu="event.preventDefault()"></canvas></div>
  <div id="log"></div>
  <div id="hud"></div>

<script>
  var statusEl = document.getElementById('status');
  var logEl = document.getElementById('log');
  var canvasEl = document.getElementById('canvas');

  // Kept rather than overwritten, and kept separate from the status line: an
  // error that replaces the status reads as a status, which is how a failure
  // came to look like an ordinary message.
  function log(text, isError) {
    var line = document.createElement('div');
    line.textContent = text;
    if (isError) line.className = 'bad';
    logEl.appendChild(line);
    while (logEl.childNodes.length > 12) logEl.removeChild(logEl.firstChild);
  }

  var Module = {
    canvas: canvasEl,
    // Left on the document deliberately.  A canvas cannot take focus without a
    // tabindex, and preventDefault on mousedown stops a click from focusing it
    // even then, so keys aimed at the canvas never arrive.
    print: function (text) {
      log(text, false);
      console.log(text);
    },
    printErr: function (text) {
      log(text, true);
      console.error(text);
    },
    setStatus: function (text) {
      if (text) statusEl.textContent = text;
    },
    onRuntimeInitialized: function () {
      statusEl.textContent = 'ready - choose SIMTOWER.EXE';
      startHud();
    }
  };

  document.getElementById('file').addEventListener('change', function (event) {
    var file = event.target.files && event.target.files[0];
    if (!file) return;
    statusEl.textContent = 'reading ' + file.name + '...';

    var reader = new FileReader();
    reader.onload = function () {
      var bytes = new Uint8Array(reader.result);

      // KWAJ is the compressed form off the install disc.  Naming the file that
      // is wanted beats failing to parse a header that was never an NE.
      if (bytes.length > 4 && bytes[0] === 0x4B && bytes[1] === 0x57 &&
          bytes[2] === 0x41 && bytes[3] === 0x4A) {
        statusEl.textContent = file.name + ' is KWAJ-compressed. Run the '
          + 'installer and use the SIMTOWER.EXE it writes.';
        return;
      }

      var pointer = Module._malloc(bytes.length);
      Module.HEAPU8.set(bytes, pointer);
      var count = Module._simtowerLoadExecutable(pointer, bytes.length);
      Module._free(pointer);

      refreshSaves();
      statusEl.textContent = count > 0
        ? count + ' resources read - SimTower is running'
        : 'could not read resources out of ' + file.name
          + ' (see the console for why)';
    };
    reader.readAsArrayBuffer(file);
  });

  // Saved towers live in an IndexedDB-backed directory inside the page, which
  // is private to this browser and can be cleared without warning.  These are
  // the way out and the way back in: a tower can be downloaded and kept, and a
  // .TDT from anywhere - including the real game - can be dropped in.
  var SAVES = '/saves';

  function saveNames() {
    try {
      return Module.FS.readdir(SAVES).filter(function (name) {
        return /\.tdt$/i.test(name);
      });
    } catch (e) {
      return [];
    }
  }

  function download(name) {
    var bytes = Module.FS.readFile(SAVES + '/' + name);
    var url = URL.createObjectURL(new Blob([bytes],
                                  { type: 'application/octet-stream' }));
    var link = document.createElement('a');
    link.href = url;
    link.download = name;
    link.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }

  function refreshSaves() {
    var list = document.getElementById('saveList');
    var names = saveNames();
    list.textContent = '';
    if (!names.length) {
      list.textContent = 'none yet \u2014 save one from the game\u2019s File menu';
      return;
    }
    names.forEach(function (name, index) {
      if (index) list.appendChild(document.createTextNode('  '));
      var button = document.createElement('button');
      button.type = 'button';
      button.textContent = name;
      button.title = 'download ' + name;
      button.onclick = function () { download(name); };
      list.appendChild(button);
    });
  }

  document.getElementById('refresh').addEventListener('click', refreshSaves);

  document.getElementById('import').addEventListener('change', function (event) {
    var file = event.target.files && event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      // The game measures a save's name from the last backslash and wants at
      // most eight characters before the dot, so a long name is trimmed here
      // rather than refused by the game later.
      var base = file.name.replace(/\.[^.]*$/, '')
                          .replace(/[\\/:]/g, '')
                          .toUpperCase()
                          .slice(0, 8) || 'TOWER';
      Module.FS.writeFile(SAVES + '/' + base + '.TDT',
                          new Uint8Array(reader.result));
      try { Module.FS.syncfs(false, function () {}); } catch (e) {}
      refreshSaves();
      statusEl.textContent = 'imported ' + base
        + '.TDT \u2014 open it from the game\u2019s File menu';
    };
    reader.readAsArrayBuffer(file);
    event.target.value = '';
  });

  // A software rasteriser is worth measuring rather than guessing about.
  function startHud() {
    var hud = document.getElementById('hud');
    var frames = 0, last = performance.now();
    function tick() {
      frames++;
      var now = performance.now();
      if (now - last >= 1000) {
        hud.textContent = frames + ' fps  ' + canvasEl.width + 'x'
                        + canvasEl.height;
        frames = 0;
        last = now;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
</script>
{{{ SCRIPT }}}
</body>
</html>
